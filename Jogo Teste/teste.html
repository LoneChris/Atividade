<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo da Forca</title>
    <link rel="stylesheet" href="teste.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Jogo da Forca</h1>
        
        <!-- Painel de Dicas -->
        <div class="dicas-container">
            <p id="dica-inicial"><strong>Dica Inicial:</strong> <span id="texto-dica-inicial"></span></p>
            <button id="btn-dica-vip" onclick="revelarDicaVip()">🔓 Liberar Dica VIP</button>
            <p id="dica-vip" class="hidden"><strong>🔥 Dica VIP:</strong> <span id="texto-dica-vip"></span></p>
        </div>

        <!-- Vidas e Painel Visual -->
        <div class="status-container">
            <p>Vidas restantes: <span id="contador-vidas">5</span></p>
            <div id="visual-vidas">❤️❤️❤️❤️❤️</div>
        </div>

        <!-- Palavra Secreta (Trassos) -->
        <div id="palavra-display" class="palavra-display"></div>

        <!-- Letras já digitadas -->
        <p class="letras-usadas">Letras tentadas: <span id="letras-tentadas">-</span></p>

        <!-- Controles de Entrada -->
        <div class="controles">
            <div class="grupo-input">
                <input type="text" id="input-letra" maxlength="1" placeholder="Letra" autocomplete="off">
                <button onclick="jogarLetra()">Tentar Letra</button>
            </div>

            <div class="grupo-input aposta-container">
                <input type="text" id="input-aposta" placeholder="Chute a palavra completa!" autocomplete="off">
                <button onclick="jogarAposta()" class="btn-aposta">Aposta Final 🎰</button>
            </div>
        </div>

        <!-- Mensagens de Feedback -->
        <p id="mensagem" class="mensagem"></p>
        <button id="btn-reiniciar" class="hidden" onclick="reiniciarJogo()">Jogar Novamente 🔄</button>
    </div>


    <script src="teste.js"></script>
</body>
</html>
